    <circle cx="22" cy="20" r="4" fill="#fb7185"/>
    <circle cx="38" cy="20" r="4" fill="#fbbf24"/>
    <circle cx="54" cy="20" r="4" fill="#34d399"/>
    <text x="78" y="25" fill="#a9bdd5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">rain · agent workspace</text>
