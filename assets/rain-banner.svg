  <text x="76" y="247" fill="#a5b4fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2.5">INNOVATIVE NICHE AI</text>
  <text x="76" y="294" fill="#d8e4f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Local-first AI chat. Approval-driven coding.</text>
