<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">R.A.I.N. — Reasonable Assistant for Innovative Niche AI</title>
  <desc id="desc">A dark, premium technical banner representing a local-first AI assistant, streaming conversation, and approval-driven coding tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14243a" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0b1424" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8da8c8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="90" r="125" fill="#4f46e5" opacity=".13" filter="url(#glow)"/>
  <circle cx="1120" cy="320" r="105" fill="#22d3ee" opacity=".10" filter="url(#glow)"/>
  <path d="M0 338C210 270 350 440 600 340S1000 220 1280 292" fill="none" stroke="#67e8f9" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M0 365C240 300 400 450 680 360S1030 270 1280 330" fill="none" stroke="#818cf8" stroke-opacity=".14" stroke-width="1.5"/>
